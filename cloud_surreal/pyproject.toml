[project]
name = "planinc-cloud-surreal"
version = "0.1.0"
description = "Robyn + embedded SurrealKV server for PlanInc"
requires-python = ">=3.11,<3.14"
dependencies = [
    "robyn>=0.88,<0.89",
    "surrealdb>=2.0,<3",
    "PyJWT>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<0.17",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

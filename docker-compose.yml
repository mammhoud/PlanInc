# =============================================================================
# PlanInc — self-hosted planning & incubation platform
# =============================================================================
# SurrealDB runs in embedded file mode (surrealkv://) — no container needed.
# The database file is stored at ./runtime/data/planinc.db inside the
# planing service volume. No surrealdb image, no port 8000.
# Served at tools.structa.cloud/planinc/ via the tools-proxy Nginx.
# =============================================================================

networks:
  common:
    external: true

services:
  planinc:
    build:
      context: ./src
      dockerfile: dockerfile
    image: planinc-local:latest
    container_name: planinc
    ports:
      - "${PLANINC_PORT:-1111}:1111"
    environment:
      NEXTAUTH_SECRET: ${PLANINC_NEXTAUTH_SECRET:-planinc-secret-change-me}
      # PlanInc is mounted below /planinc/ by tools-proxy; both URL settings
      # must use the public prefix while Nginx strips it upstream.
      NEXTAUTH_URL: ${PLANINC_PUBLIC_URL:-https://tools.structa.cloud/planinc}
      NEXT_PUBLIC_BASE_URL: ${PLANINC_PUBLIC_URL:-https://tools.structa.cloud/planinc}
      PLANINC_PORT: "1111"
      NODE_ENV: production
      # SurrealDB embedded file — path inside the container data volume.
      PLANINC_DB_FILE: /app/data/planinc.db
      PLANINC_DB_NS: planinc
      PLANINC_DB_NAME: planinc
      PLANINC_CORS_ORIGINS: ${PLANINC_CORS_ORIGINS:-}
      # Chat context root: the project tree is mounted read-only so a chat can
      # read the repository it is asked about but never write to it.
      PLANINC_CONTEXT_PROJECT_DIR: /app/context
      PLANINC_CONTEXT_MAX_BYTES: ${PLANINC_CONTEXT_MAX_BYTES:-262144}
    volumes:
      # Persist the SurrealDB file and uploads across container restarts.
      - ./src/data:/app/data
      - ${PLANINC_CONTEXT_DIR:-../../..}:/app/context:ro
    networks:
      - common
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1111/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

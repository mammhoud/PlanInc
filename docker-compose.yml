# =============================================================================
# PlanInc — self-hosted planning & incubation platform
# =============================================================================
# SurrealDB runs in embedded file mode (surrealkv://) — no container needed.
# The database file is stored at ./runtime/data/planinc.db inside the
# planing service volume. No surrealdb image, no port 8000.
# Served at tools.structa.cloud/planing/ via the tools-proxy Nginx.
# =============================================================================

networks:
  common:
    external: true

services:
  planing:
    build:
      context: ./runtime
      dockerfile: Dockerfile
    image: planing-local:latest
    container_name: planing
    ports:
      - "${PLANING_PORT:-1111}:1111"
    environment:
      NEXTAUTH_SECRET: ${PLANING_NEXTAUTH_SECRET:-planing-secret-change-me}
      # Planing is mounted below /planing/ by tools-proxy; both URL settings
      # must use the public prefix while Nginx strips it upstream.
      NEXTAUTH_URL: ${PLANING_PUBLIC_URL:-https://tools.structa.cloud/planing}
      NEXT_PUBLIC_BASE_URL: ${PLANING_PUBLIC_URL:-https://tools.structa.cloud/planing}
      PLANING_PORT: "1111"
      NODE_ENV: production
      # SurrealDB embedded file — path inside the container data volume.
      # Override SURREALDB_FILE to point to a different path if needed.
      SURREALDB_FILE: /app/data/planinc.db
      SURREALDB_NS: planinc
      SURREALDB_DB: planinc
      # Chat context root: the project tree is mounted read-only so a chat can
      # read the repository it is asked about but never write to it.
      PLANING_CONTEXT_PROJECT_DIR: /app/context
      PLANING_CONTEXT_MAX_BYTES: ${PLANING_CONTEXT_MAX_BYTES:-262144}
    volumes:
      # Persist the SurrealDB file and uploads across container restarts.
      - ./runtime/data:/app/data
      - ${PLANING_CONTEXT_DIR:-../../..}:/app/context:ro
    networks:
      - common
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1111/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

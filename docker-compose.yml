# =============================================================================
# PlanInc — self-hosted planning & incubation platform
# =============================================================================
# SurrealDB runs in embedded file mode (surrealkv://) — no container needed.
# the database file remains at ./data/planinc.db after the runtime cutover so
# the source stack can use the existing persistent data without a data move.
# No surrealdb image, no port 8000.
# Served at its own domain, notes.structa.cloud, by a dedicated Traefik vhost
# (proxy/configs/traefik/dynamic/notes.yml). Deploy with
# PLANINC_EXTERNAL_NETWORK=true PLANINC_NETWORK_NAME=common so Traefik can
# resolve the container as planinc:1111 on the shared `common` network (create
# it once with `docker network create common`).
# =============================================================================

networks:
  # Local deployments create a project-scoped network automatically. Behind the
  # proxy stack set PLANINC_EXTERNAL_NETWORK=true and PLANINC_NETWORK_NAME=common
  # to attach to the pre-existing external network: `external` is a boolean
  # toggle, and the name selects which existing network it attaches to.
  default:
    name: ${PLANINC_NETWORK_NAME:-planinc-network}
    external: ${PLANINC_EXTERNAL_NETWORK:-false}

services:
  planinc:
    build:
      context: .
      dockerfile: dockerfile
    image: planinc-local:latest
    container_name: planinc
    ports:
      - "${PLANINC_PORT:-1111}:1111"
    environment:
      # The source server reads PLANINC_NEXTAUTH_SECRET as its JWT secret.
      NEXTAUTH_SECRET: ${PLANINC_NEXTAUTH_SECRET:-planinc-secret-change-me}
      # Bootstrap superuser: created on first boot when set (idempotent after).
      PLANINC_SUPERUSER_NAME: ${PLANINC_SUPERUSER_NAME:-}
      PLANINC_SUPERUSER_PASSWORD: ${PLANINC_SUPERUSER_PASSWORD:-}
      PLANINC_PORT: "1111"
      PLANINC_DB_FILE: /app/data/planinc.db
      PLANINC_DB_NS: ${PLANINC_DB_NS:-planinc}
      PLANINC_DB_NAME: ${PLANINC_DB_NAME:-planinc}
      # Uploads (written under the same data volume as the database file).
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      # Chat context root: the project tree is mounted read-only so a chat can
      # read the repository it is asked about but never write to it.
      PLANINC_CONTEXT_PROJECT_DIR: /app/context
      PLANING_CONTEXT_MAX_BYTES: ${PLANINC_CONTEXT_MAX_BYTES:-262144}
    volumes:
      # Persist the SurrealDB file and uploads across container restarts.
      - ./data:/app/data
      - ${PLANINC_CONTEXT_DIR:-../../..}:/app/context:ro
    networks:
      - default
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1111/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

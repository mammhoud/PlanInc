<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-label="PlanInc loading">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0B2545"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="70%" stop-color="#0077B6"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark-shell background: matches the app's --background in dark mode. -->
  <rect width="100%" height="100%" fill="#0b0b0c" rx="16"/>
  <circle cx="80" cy="300" r="52" fill="url(#primaryGrad)" opacity="0.55">
    <animate attributeName="opacity" values="0.55;0.2;0.55" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="200" r="34" fill="url(#accentGrad)" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="340" r="20" fill="#00C6FF" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.05;0.35" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Dark variant: the mark drops in from above (translateY(-22)) so it reads
       as "rising up" onto a dark field, rather than dropping onto it. -->
  <g>
    <g transform="translate(200, 45)">
      <polygon points="100,10 180,55 180,145 100,190 20,145 20,55"
               fill="none" stroke="url(#primaryGrad)" stroke-width="10" stroke-linejoin="round"/>
      <circle cx="100" cy="10" r="5" fill="#00C6FF"/>
      <circle cx="180" cy="55" r="5" fill="#0077B6"/>
      <circle cx="180" cy="145" r="5" fill="#0077B6"/>
      <circle cx="100" cy="190" r="5" fill="#00C6FF"/>
      <circle cx="20" cy="145" r="5" fill="#0077B6"/>
      <circle cx="20" cy="55" r="5" fill="#00C6FF"/>
      <path d="M 100,10 L 140,32 M 180,55 L 140,85 M 180,145 L 140,120"
            stroke="#00F2FE" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
      <path d="M 20,55 L 60,40 M 20,145 L 60,110"
            stroke="#00C6FF" stroke-width="2" opacity="0.6"/>
      <path d="M 35,140 L 85,95 L 115,120 L 165,45"
            fill="none" stroke="url(#accentGrad)" stroke-width="12"
            stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="165,30 185,50 155,55" fill="#00F2FE" filter="url(#glow)"/>
    </g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 -22; 0 0; 0 -22"
                      keyTimes="0;0.5;1"
                      dur="1.6s" repeatCount="indefinite"/>
  </g>

  <g>
    <text x="300" y="300"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="44" font-weight="800" fill="url(#textGrad)" text-anchor="middle" letter-spacing="6">PLANINC</text>
    <animateTransform attributeName="transform" type="translate"
                      values="0 -22; 0 0; 0 -22"
                      keyTimes="0;0.5;1"
                      dur="1.6s" repeatCount="indefinite"/>
  </g>
</svg>

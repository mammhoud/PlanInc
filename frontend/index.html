<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/planinc-mark.svg" type="image/svg+xml" />
  <!-- viewport-fit=cover is required for env(safe-area-inset-*) to be non-zero on
       notched devices; src/styles/platform.css depends on it for every target whose
       capabilities.safeAreaInsets is true (phone browsers, PWA, Android, iOS). -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="application-name" content="PlanInc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PlanInc" />

  <!-- App icon / favicon — the brand NEW mark is an inline SVG, so no PNG ever
       has to be generated to keep the icon crisp at 16px, 32px and on masks.
       `rel=icon` + `rel=shortcut icon` share the same source; the second one
       is the legacy IE/shotcut shorthand. -->
  <link rel="icon" href="/planinc-mark.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="/planinc-mark.svg" type="image/svg+xml" />

  <!-- Apple touch icon: 120/152/167/180px are the sizes iOS actually asks for.
       The PNGs are derived from `planinc-mark.svg`; the ordering below is the
       fixed mapping (142px→120, 150px→152, 284px→167 + 180). -->
  <link rel="apple-touch-icon" sizes="120x120" href="/icons/Square120x120Logo.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/Square152x152Logo.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="/icons/Square167x167Logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/Square180x180Logo.png" />

  <meta name="description" content="PlanInc self-hosted personal note" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="msapplication-config" content="/icons/browserconfig.xml" />
  <meta name="msapplication-TileColor" content="#f59e0b" />
  <meta name="msapplication-tap-highlight" content="no" />
  <!-- The OS draws the browser/status chrome, so it needs a colour before any
       stylesheet runs. Media-scoped so the shell matches the app's own theme
       instead of flashing white in dark mode. These are the two values the
       token contract has in light/dark for --background; a <meta> cannot read
       a CSS variable, so this is the one place a literal is unavoidable. -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="shortcut icon" href="/planinc-mark.svg" type="image/svg+xml" />
  <title>PlanInc</title>

  <!-- Edge-to-edge on iOS: the webview draws under the status bar, which is what
       makes the safe-area insets in platform.css meaningful. -->
  <!--

  <script>
    var vConsole = new window.VConsole();
  </script> -->
</head>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

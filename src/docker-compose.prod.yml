# docker-compose.prod.yml — production stack
#
# Datastore: embedded SurrealDB (SurrealKV) inside the app process — one
# database file on the `planinc-data` volume. No PostgreSQL, no external
# database host, no SQL database.
networks:
  planinc-network:
    driver: bridge

volumes:
  planinc-data:

services:
  planinc-website:
    # Built from the local source (this is a fork, not upstream's image).
    build:
      context: .
      dockerfile: ./dockerfile
    image: planinc-local:latest
    environment:
      NODE_ENV: production
      # NEXTAUTH_URL: http://localhost:1111
      # NEXT_PUBLIC_BASE_URL: http://localhost:1111
      NEXTAUTH_SECRET: my_ultra_secure_nextauth_secret
      # Embedded SurrealKV database file (like a SQLite file) — mounted below.
      PLANINC_DB_FILE: /app/data/planinc.db
      PLANINC_DB_NS: planinc
      PLANINC_DB_NAME: planinc
    volumes:
      - planinc-data:/app/data
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - 1111:1111
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:1111/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - planinc-network

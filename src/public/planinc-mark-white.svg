<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="title desc">
  <title id="title">PlanInc</title>
  <desc id="desc">PlanInc brand mark in white — for dark overlays and dark shell.</desc>

  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
  </defs>

  <!-- Transparent background: caller places this on any dark surface. -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Logo Mark (Hexagon & Ascending Tech Arrow) — white stroke + cyan arrow -->
  <g transform="translate(200, 45)">
    <polygon points="100,10 180,55 180,145 100,190 20,145 20,55"
             fill="none" stroke="#F8FAFC" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="100" cy="10" r="5" fill="#00C6FF"/>
    <circle cx="180" cy="55" r="5" fill="#0077B6"/>
    <circle cx="180" cy="145" r="5" fill="#0077B6"/>
    <circle cx="100" cy="190" r="5" fill="#00C6FF"/>
    <circle cx="20" cy="145" r="5" fill="#0077B6"/>
    <circle cx="20" cy="55" r="5" fill="#00C6FF"/>
    <path d="M 100,10 L 140,32 M 180,55 L 140,85 M 180,145 L 140,120"
          stroke="#00F2FE" stroke-width="2" opacity="0.85"/>
    <path d="M 20,55 L 60,40 M 20,145 L 60,110"
          stroke="#00C6FF" stroke-width="2" opacity="0.85"/>
    <path d="M 35,140 L 85,95 L 115,120 L 165,45"
          fill="none" stroke="url(#accentGrad)" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="165,30 185,50 155,55" fill="#00F2FE"/>
  </g>

  <!-- Typography in crisp white -->
  <text x="300" y="300"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="6">PLANINC</text>
</svg>

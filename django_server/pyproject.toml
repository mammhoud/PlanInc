[project]
name = "planinc-django-server"
version = "0.1.0"
description = "Django server alternative for PlanInc"
requires-python = ">=3.11,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "django-allauth>=65.18,<66",
    "PyJWT>=2.10,<3",
    "django-bolt>=0.3.12,<0.4",
    "django-fusion>=0.5,<0.6",
    "django-tenants>=3.14,<4",
    "channels>=4.2,<5",
    "channels-redis>=4.2,<5",
    "daphne>=4.1,<5",
    "psycopg[binary]>=3.2,<4",
    "redis>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-django>=4.11,<5",
    "ruff>=0.11,<0.12",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
